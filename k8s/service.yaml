# ClusterIP strict : le backend n'est jamais exposé, seul le proxy nginx du
# frontend le joint (NetworkPolicy allow-frontend-to-backend).
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
