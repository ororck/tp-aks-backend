name: sast

# SAST : CodeQL analyse le code source sans l'exécuter. Gratuit sur dépôt
# public. Les alertes sont dans l'onglet Security > Code scanning : le job ne
# casse pas sur une alerte (informatif), l'accès aux résultats se fait par
# l'onglet Security et la vérification "Code scanning results" des PR.
# Doc : https://docs.github.com/en/code-security/code-scanning
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:java-kotlin
