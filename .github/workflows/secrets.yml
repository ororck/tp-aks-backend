name: secrets

# Secrets : gitleaks en binaire (`gitleaks dir`), pas l'action GitHub qui
# calcule une plage de commits invalide sur les merges. Bloquant : le code de
# sortie 1 signale un secret détecté. --redact masque la valeur dans le rapport.
# Doc : https://github.com/gitleaks/gitleaks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Détection de secrets
        run: ./gitleaks dir . --redact -v 2>&1 | tee gitleaks.txt; exit "${PIPESTATUS[0]}"

      - name: Résumé dans le Job Summary
        if: always()
        run: |
          {
            echo '### gitleaks'
            echo '```'
            cat gitleaks.txt 2>/dev/null || echo 'aucun rapport produit'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
