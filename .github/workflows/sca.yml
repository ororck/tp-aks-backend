name: sca

# SCA : OSV-Scanner (Google) compare les dépendances déclarées à la base OSV.
# BLOQUANT : l'arriéré a été soldé lors de la remédiation (jour 2), toute
# nouvelle vulnérabilité connue fait échouer le job. Le rapport reste publié
# dans le Job Summary, même en cas d'échec.
# Doc : https://google.github.io/osv-scanner/
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installer osv-scanner
        run: |
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
      - name: Scan des dépendances
        run: ./osv-scanner scan source --lockfile pom.xml --format table --output-file osv.txt

      - name: Résumé dans le Job Summary
        if: always()
        run: |
          {
            echo '### OSV-Scanner'
            echo '```'
            cat osv.txt 2>/dev/null || echo 'aucun rapport produit'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
